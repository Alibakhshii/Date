<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>یه سوال کوچیک 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-soft:#ffdbe9;
    --pink-deep:#ff6fa5;
    --lilac:#e7dcff;
    --rosegold:#e0ac9d;
    --cream:#fff8f8;
    --ink:#4a2b3a;
    --glass: rgba(255,255,255,0.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(160deg,var(--cream) 0%, var(--pink-soft) 45%, var(--lilac) 100%);
    color:var(--ink);
    overflow-x:hidden;
  }
  #app{position:relative; min-height:100vh; width:100%; overflow:hidden;}

  /* Floating background elements */
  #bg-layer{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .floaty{
    position:absolute; top:-40px; font-size:22px; opacity:0.55;
    animation: fall linear infinite;
    user-select:none;
  }
  @keyframes fall{
    0%{ transform: translateY(-10vh) rotate(0deg); }
    100%{ transform: translateY(110vh) rotate(360deg); }
  }

  .page{
    position:relative; z-index:1;
    min-height:100vh; width:100%;
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    padding:32px 18px 60px;
    text-align:center;
  }
  .page.active{display:flex;}
  .page.enter{animation: pageIn .55s cubic-bezier(.2,.9,.25,1) both;}
  @keyframes pageIn{
    from{opacity:0; transform: scale(.94) translateY(18px);}
    to{opacity:1; transform: scale(1) translateY(0);}
  }

  .eyebrow{font-size:14px; color:var(--pink-deep); letter-spacing:.05em; margin-bottom:6px; font-weight:600;}

  h1.hero{
    font-size:clamp(28px,7vw,52px);
    font-weight:800;
    margin:0 0 10px;
    color:var(--ink);
    text-shadow: 0 2px 18px rgba(255,111,165,0.25);
  }
  p.sub{
    font-size:clamp(14px,3.2vw,18px);
    color:#7a5468;
    margin:0 0 34px;
    max-width:420px;
  }

  .btn-row{display:flex; gap:18px; align-items:center; justify-content:center; flex-wrap:wrap; position:relative; min-height:90px;}

  .btn{
    border:none; cursor:pointer; border-radius:999px;
    font-family:inherit; font-weight:700;
    transition: transform .35s cubic-bezier(.2,.9,.25,1), font-size .35s ease, opacity .35s ease, box-shadow .3s ease;
    position:relative; overflow:hidden;
  }
  .btn-yes{
    background: linear-gradient(135deg,#ff8fb8,var(--pink-deep));
    color:#fff; font-size:20px; padding:16px 40px;
    box-shadow: 0 10px 28px rgba(255,111,165,0.45);
  }
  .btn-yes:hover{ transform: translateY(-3px) scale(1.03); box-shadow:0 14px 34px rgba(255,111,165,0.55); }
  .btn-no{
    background:#f3e8ee; color:#9c7a8a; font-size:16px; padding:12px 26px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.06);
  }
  .btn-no:hover{ transform: translateY(-2px); }

  .ripple{position:absolute; border-radius:50%; background:rgba(255,255,255,0.6); transform:scale(0); animation:rip .6s ease-out; pointer-events:none;}
  @keyframes rip{ to{ transform:scale(3.2); opacity:0; } }

  .taunt{
    margin-top:22px; font-size:15px; color:var(--pink-deep); font-weight:600; min-height:24px;
  }
  .taunt.show{ animation: popfade .5s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes popfade{
    0%{opacity:0; transform: scale(.6);}
    60%{opacity:1; transform: scale(1.08);}
    100%{opacity:1; transform: scale(1);}
  }

  /* Glass card */
  .glass-card{
    background:var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:24px;
    padding:28px 26px;
    box-shadow: 0 12px 34px rgba(180,90,130,0.18);
    max-width:420px; width:100%;
  }

  .field{margin-bottom:18px; text-align:right;}
  .field label{display:block; font-size:14px; color:#8a6072; margin-bottom:8px; font-weight:600;}
  .field input{
    width:100%; padding:14px 16px; border-radius:16px;
    border:1px solid rgba(255,255,255,0.8);
    background:rgba(255,255,255,0.75);
    font-family:inherit; font-size:15px; color:var(--ink);
    outline:none; transition: box-shadow .25s ease, border-color .25s ease;
  }
  .field input:focus{ border-color:var(--pink-deep); box-shadow:0 0 0 4px rgba(255,111,165,0.18); }

  .btn-continue{
    margin-top:6px; width:100%;
    background:linear-gradient(135deg,#ff8fb8,var(--pink-deep));
    color:#fff; font-size:17px; padding:14px 20px; border:none; border-radius:16px;
    font-family:inherit; font-weight:700; cursor:pointer;
    box-shadow:0 10px 24px rgba(255,111,165,0.4);
    transition: transform .25s ease, opacity .25s ease;
  }
  .btn-continue:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-continue:not(:disabled):hover{ transform: translateY(-2px); }

  /* Food grid */
  .food-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:14px; max-width:520px; width:100%; margin-bottom:26px;
  }
  .food-card{
    background:rgba(255,255,255,0.7);
    border:2px solid transparent;
    border-radius:18px; padding:16px 8px 12px;
    cursor:pointer; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    box-shadow:0 6px 16px rgba(180,90,130,0.12);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .food-card:hover{ transform: translateY(-4px) scale(1.03); box-shadow:0 10px 22px rgba(180,90,130,0.22); }
  .food-card.selected{ border-color:var(--pink-deep); background:rgba(255,219,233,0.85); transform: translateY(-3px); }
  .food-emoji{font-size:34px;}
  .food-name{font-size:13px; font-weight:600; color:#7a5468;}

  .btn-final{
    background:linear-gradient(135deg,#ff8fb8,var(--pink-deep));
    color:#fff; font-size:18px; padding:15px 38px; border:none; border-radius:999px;
    font-family:inherit; font-weight:700; cursor:pointer;
    box-shadow:0 10px 26px rgba(255,111,165,0.4);
    transition: transform .25s ease;
  }
  .btn-final:not(:disabled):hover{ transform: translateY(-2px); }
  .btn-final:disabled{ opacity:.45; cursor:not-allowed; }

  .confetti-piece{ position:fixed; top:-20px; z-index:20; pointer-events:none; font-size:20px; }
  @keyframes confettiFall{
    0%{ transform: translateY(-10vh) rotate(0deg); opacity:1;}
    100%{ transform: translateY(110vh) rotate(600deg); opacity:0.9;}
  }

  .result-box{
    background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.6); border-radius:24px; padding:30px 26px;
    max-width:440px; width:100%; box-shadow:0 14px 36px rgba(180,90,130,0.2);
    margin-top:10px;
  }
  .result-box p{ margin:6px 0; font-size:16px; line-height:1.9; }
  .result-highlight{ color:var(--pink-deep); font-weight:800; }

  .car-img{ margin-top:26px; max-width:260px; width:70%; filter:drop-shadow(0 10px 18px rgba(180,90,130,0.3)); }

  .dots{ display:flex; gap:8px; margin-bottom:22px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:rgba(180,90,130,0.25); }
  .dot.active{ background:var(--pink-deep); }

  .admin-panel{ position:relative; z-index:1; max-width:520px; margin:40px auto; padding:24px; }
  .admin-panel table{ width:100%; border-collapse:collapse; background:rgba(255,255,255,0.7); border-radius:14px; overflow:hidden; }
  .admin-panel th,.admin-panel td{ padding:10px; font-size:13px; border-bottom:1px solid rgba(180,90,130,0.15); text-align:right; }

  @media (max-width:380px){
    .btn-yes{padding:14px 30px; font-size:18px;}
    .btn-no{padding:10px 20px; font-size:14px;}
  }
</style>
</head>
<body>

<div id="bg-layer"></div>
<div id="app"></div>

<script>
/* ---------------- Background floating hearts & petals ---------------- */
const bgLayer = document.getElementById('bg-layer');
const floatSymbols = ['💗','🌸','🤍','💕','🌷'];
function spawnFloaty(){
  const el = document.createElement('div');
  el.className='floaty';
  el.textContent = floatSymbols[Math.floor(Math.random()*floatSymbols.length)];
  el.style.left = Math.random()*100+'vw';
  const duration = 9 + Math.random()*8;
  el.style.animationDuration = duration+'s';
  el.style.fontSize = (14 + Math.random()*18)+'px';
  bgLayer.appendChild(el);
  setTimeout(()=>el.remove(), duration*1000+500);
}
setInterval(spawnFloaty, 700);
for(let i=0;i<8;i++) setTimeout(spawnFloaty, i*300);

/* ---------------- State ---------------- */
const state = {
  step: 'ask', // ask -> schedule -> food -> final
  noStage: 0,
  date: '', time: '', food: '', foodEmoji: ''
};

const STORAGE_KEY = 'invite-response-v1';

/* اگه این سایت رو روی گیت‌هاب یا هر جای دیگه‌ای غیر از Claude هاست کردی،
   window.storage در دسترس نیست. برای اینکه خودت جواب رو ببینی،
   ایمیل خودت رو اینجا بذار تا یک دکمه‌ی ارسال خودکار پیام نشون داده بشه. */
const NOTIFY_EMAIL = ''; // مثال: 'your-email@example.com'
const NOTIFY_PHONE = ''; // مثال: '+989121234567' (با کد کشور)

/* ارسال خودکار و بی‌صدا به تلگرام وقتی دکمه «بزن بریم» زده میشه */
const TG_BOT_TOKEN = '8866283111:AAGe7ZLQNwVpQVm-ll2qM6QkFHUzbLWydxo';
const TG_CHAT_ID = '307577131';

async function sendTelegramNotification(){
  if(!TG_BOT_TOKEN || !TG_CHAT_ID) return;
  if(state.telegramSent) return;
  const text = `❤️ جواب قرار رسید!\nتاریخ: ${formatDate(state.date)}\nساعت: ${toPersianDigits(state.time)}\nغذا: ${state.foodEmoji} ${state.food}`;
  try{
    await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: TG_CHAT_ID, text })
    });
    state.telegramSent = true;
    persistState();
  }catch(e){ /* silent fail, no UI disruption */ }
}

/* Try to restore saved answer (localStorage first, then shared storage) */
async function restoreState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      Object.assign(state, saved);
    }
  }catch(e){}
}

async function persistState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(window.storage){
    try{
      await window.storage.set('response:'+STORAGE_KEY, JSON.stringify({
        date: state.date, time: state.time, food: state.food, foodEmoji: state.foodEmoji,
        savedAt: new Date().toISOString()
      }), true);
    }catch(e){ /* storage may not be available outside artifact runtime */ }
  }
}

const MAX_NO_STAGE = 4;
const taunts = [
  '🥺 مطمئنی؟',
  'یه بار دیگه فکر کن...',
  'قول میدم خوش بگذره... 🍕',
  'دیگه نه‌ای وجود نداره...<br>فقط آره مونده ❤️'
];

const foods = [
  {emoji:'🍕', name:'پیتزا'},
  {emoji:'🍔', name:'برگر'},
  {emoji:'🍗', name:'سوخاری'},
  {emoji:'🍣', name:'سوشی'},
  {emoji:'🍝', name:'پاستا'},
  {emoji:'🥩', name:'استیک'},
  {emoji:'🌮', name:'تاکو'},
  {emoji:'🍜', name:'رامن'},
  {emoji:'🍰', name:'کافه و کیک'},
  {emoji:'🍨', name:'بستنی'}
];

const app = document.getElementById('app');

function ripple(e, btn){
  const r = document.createElement('span');
  r.className='ripple';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.width = r.style.height = size+'px';
  r.style.left = (e.clientX - rect.left - size/2)+'px';
  r.style.top = (e.clientY - rect.top - size/2)+'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 650);
}

function render(){
  if(state.step==='ask') renderAsk();
  else if(state.step==='schedule') renderSchedule();
  else if(state.step==='food') renderFood();
  else if(state.step==='final') renderFinal();
}

function renderAsk(){
  app.innerHTML = `
    <div class="page active enter">
      <div class="eyebrow">یه سوال کوچیک</div>
      <h1 class="hero">با من میای سر قرار؟ 🥺</h1>
      <p class="sub">فقط یک سؤال ساده‌ست... جوابش فقط یکیه 🤍</p>
      <div class="btn-row">
        <button id="yesBtn" class="btn btn-yes">❤️ آره</button>
        <button id="noBtn" class="btn btn-no">💔 نه</button>
      </div>
      <div id="taunt" class="taunt"></div>
    </div>
  `;
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const taunt = document.getElementById('taunt');

  applyStageStyles(yesBtn, noBtn);
  if(state.noStage>0 && state.noStage<=MAX_NO_STAGE){
    taunt.innerHTML = taunts[state.noStage-1];
    taunt.classList.add('show');
  }

  yesBtn.addEventListener('click', (e)=>{
    ripple(e, yesBtn);
    setTimeout(()=>{
      state.step='schedule';
      render();
    }, 220);
  });

  noBtn.addEventListener('click', (e)=>{
    if(state.noStage >= MAX_NO_STAGE) return;
    ripple(e, noBtn);
    state.noStage++;
    applyStageStyles(yesBtn, noBtn);
    taunt.classList.remove('show');
    void taunt.offsetWidth;
    taunt.innerHTML = taunts[state.noStage-1];
    taunt.classList.add('show');
    if(state.noStage>=MAX_NO_STAGE){
      setTimeout(()=>{ noBtn.style.display='none'; }, 380);
    }
  });
}

/* Instead of transform:scale (which doesn't affect layout and causes overlap),
   we resize font-size/padding directly so flexbox reflows and pushes buttons apart. */
const BASE_YES = { font:20, padX:40, padY:16 };
const BASE_NO  = { font:16, padX:26, padY:12 };

function applyStageStyles(yesBtn, noBtn){
  const yesGrow = 1 + state.noStage * 0.22;   // gentler, cumulative growth
  const noShrink = Math.max(1 - state.noStage * 0.22, 0.18);

  yesBtn.style.fontSize = (BASE_YES.font * yesGrow).toFixed(1) + 'px';
  yesBtn.style.padding = (BASE_YES.padY * yesGrow).toFixed(1) + 'px ' + (BASE_YES.padX * yesGrow).toFixed(1) + 'px';

  noBtn.style.fontSize = (BASE_NO.font * noShrink).toFixed(1) + 'px';
  noBtn.style.padding = (BASE_NO.padY * noShrink).toFixed(1) + 'px ' + (BASE_NO.padX * noShrink).toFixed(1) + 'px';
  noBtn.style.opacity = state.noStage >= MAX_NO_STAGE - 1 ? Math.max(0, 1 - (state.noStage - (MAX_NO_STAGE-2))*0.5) : 1;
  if(state.noStage >= MAX_NO_STAGE){ noBtn.style.opacity = 0; noBtn.style.pointerEvents='none'; }
}

function renderSchedule(){
  app.innerHTML = `
    <div class="page active enter">
      <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <h1 class="hero" style="font-size:clamp(24px,6vw,38px)">عالیه ❤️</h1>
      <p class="sub">حالا فقط تاریخ و ساعت قرار رو انتخاب کن.</p>
      <div class="glass-card">
        <div class="field">
          <label>📅 انتخاب تاریخ</label>
          <input type="date" id="dateInput" value="${state.date}" />
        </div>
        <div class="field">
          <label>🕒 انتخاب ساعت</label>
          <input type="time" id="timeInput" value="${state.time}" />
        </div>
        <button id="contBtn" class="btn-continue" ${(!state.date||!state.time)?'disabled':''}>ادامه ➜</button>
      </div>
    </div>
  `;
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const contBtn = document.getElementById('contBtn');

  function check(){
    contBtn.disabled = !(dateInput.value && timeInput.value);
  }
  dateInput.addEventListener('input', ()=>{ state.date=dateInput.value; check(); });
  timeInput.addEventListener('input', ()=>{ state.time=timeInput.value; check(); });

  contBtn.addEventListener('click', ()=>{
    if(contBtn.disabled) return;
    state.step='food';
    persistState();
    render();
  });
}

function renderFood(){
  app.innerHTML = `
    <div class="page active enter">
      <div class="dots"><div class="dot active"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
      <h1 class="hero" style="font-size:clamp(22px,5.5vw,34px)">حالا بگو چی دوست داری بخوریم؟ 🍽️</h1>
      <div class="food-grid" id="foodGrid"></div>
      <button id="goBtn" class="btn-final" disabled>❤️ بزن بریم</button>
    </div>
  `;
  const grid = document.getElementById('foodGrid');
  const goBtn = document.getElementById('goBtn');

  foods.forEach(f=>{
    const card = document.createElement('div');
    card.className='food-card' + (state.food===f.name ? ' selected':'');
    card.innerHTML = `<div class="food-emoji">${f.emoji}</div><div class="food-name">${f.name}</div>`;
    card.addEventListener('click', ()=>{
      state.food = f.name;
      state.foodEmoji = f.emoji;
      [...grid.children].forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      goBtn.disabled = false;
    });
    grid.appendChild(card);
  });

  if(state.food) goBtn.disabled = false;

  goBtn.addEventListener('click', ()=>{
    if(goBtn.disabled) return;
    state.step='final';
    persistState();
    render();
    launchConfetti();
    sendTelegramNotification();
  });
}

const persianMonths = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toPersianDigits(str){
  return String(str).replace(/[0-9]/g, d => persianDigits[+d]);
}
function div(a,b){ return ~~(a/b); }
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy<=1600) ? 0 : 979;
  gy -= (gy<=1600) ? 621 : 1600;
  const gy2 = (gm>2) ? (gy+1) : gy;
  let days = (365*gy) + div((gy2+3),4) - div((gy2+99),100) + div((gy2+399),400) - 80 + gd + g_d_m[gm-1];
  jy += 33 * div(days,12053);
  days %= 12053;
  jy += 4 * div(days,1461);
  days %= 1461;
  if(days > 365){
    jy += div(days-1,365);
    days = (days-1) % 365;
  }
  let jm, jd;
  if(days < 186){
    jm = 1 + div(days,31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + div(days-186,30);
    jd = 1 + ((days-186) % 30);
  }
  return [jy, jm, jd];
}
function formatDate(d){
  if(!d) return '';
  const parts = d.split('-').map(Number);
  if(parts.length!==3) return d;
  const [gy, gm, gd] = parts;
  const [jy, jm, jd] = gregorianToJalali(gy, gm, gd);
  return `${toPersianDigits(jd)} ${persianMonths[jm-1]} ${toPersianDigits(jy)}`;
}

function renderFinal(){
  app.innerHTML = `
    <div class="page active enter">
      <div style="font-size:52px;margin-bottom:6px;">🎉</div>
      <h1 class="hero" style="font-size:clamp(24px,6vw,36px)">خوشحالم که نه نگفتی! ❤️</h1>
      <div class="result-box">
        <p>پس من در <span class="result-highlight">${formatDate(state.date)}</span></p>
        <p>ساعت <span class="result-highlight">${toPersianDigits(state.time)}</span></p>
        <p>میام دنبالت تا بریم <span class="result-highlight">${state.foodEmoji} ${state.food}</span> بخوریم. 🥰</p>
      </div>
      <p class="sub" style="margin-top:22px;">پس آماده باش...<br>خودم میام دنبالت 🚗💕</p>
      ${NOTIFY_EMAIL ? `<button id="notifyBtn" class="btn-continue" style="max-width:280px;">📩 اطلاع بده (ایمیل)</button>` : ''}
      ${NOTIFY_PHONE ? `<button id="smsBtn" class="btn-continue" style="max-width:280px; margin-top:10px;">💬 اطلاع بده (پیامک)</button>` : ''}
      <img class="car-img" alt="ماشین کارتونی صورتی" src="data:image/svg+xml;utf8,${encodeURIComponent(carSvg())}" />
    </div>
  `;
  if(NOTIFY_EMAIL){
    const notifyBtn = document.getElementById('notifyBtn');
    notifyBtn.addEventListener('click', ()=>{
      const subject = encodeURIComponent('جواب قرار ❤️');
      const body = encodeURIComponent(`آره گفتم! 🎉\nتاریخ: ${formatDate(state.date)}\nساعت: ${state.time}\nغذا: ${state.foodEmoji} ${state.food}`);
      window.location.href = `mailto:${NOTIFY_EMAIL}?subject=${subject}&body=${body}`;
    });
  }
  if(NOTIFY_PHONE){
    const smsBtn = document.getElementById('smsBtn');
    smsBtn.addEventListener('click', ()=>{
      const msg = encodeURIComponent(`آره گفتم! 🎉 تاریخ: ${formatDate(state.date)} - ساعت: ${state.time} - غذا: ${state.foodEmoji} ${state.food}`);
      // iOS از "&" و اندروید از "?" برای body استفاده می‌کنن؛ این حالت اکثر گوشی‌ها رو پوشش میده
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      window.location.href = isIOS ? `sms:${NOTIFY_PHONE}&body=${msg}` : `sms:${NOTIFY_PHONE}?body=${msg}`;
    });
  }
}

function launchConfetti(){
  const symbols = ['🎉','💗','🌸','🎀','✨','💕'];
  for(let i=0;i<40;i++){
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className='confetti-piece';
      el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      el.style.left = Math.random()*100+'vw';
      const dur = 2.5+Math.random()*2;
      el.style.animation = `confettiFall ${dur}s ease-in forwards`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), dur*1000+200);
    }, i*40);
  }
}

/* ---------------- Admin view: open link with ?admin=1 to see saved answers ---------------- */
async function maybeRenderAdmin(){
  const params = new URLSearchParams(location.search);
  if(params.get('admin')!=='1') return false;
  let rows = [];
  if(window.storage){
    try{
      const listRes = await window.storage.list('response:', true);
      if(listRes && listRes.keys){
        for(const k of listRes.keys){
          try{
            const r = await window.storage.get(k, true);
            if(r && r.value) rows.push(JSON.parse(r.value));
          }catch(e){}
        }
      }
    }catch(e){}
  }
  const localRaw = localStorage.getItem(STORAGE_KEY);
  if(localRaw){
    try{ rows.push({...JSON.parse(localRaw), source:'این دستگاه'}); }catch(e){}
  }
  const tableRows = rows.map(r=>`<tr><td>${formatDate(r.date||'')}</td><td>${r.time||'-'}</td><td>${(r.foodEmoji||'')+' '+(r.food||'-')}</td></tr>`).join('');
  app.innerHTML = `
    <div class="admin-panel">
      <h1 class="hero" style="font-size:26px;">پاسخ‌های ثبت‌شده</h1>
      <p class="sub">این صفحه فقط برای توئه؛ لینک اصلی رو بدون ?admin=1 برای طرف مقابل بفرست.</p>
      <table>
        <tr><th>تاریخ</th><th>ساعت</th><th>غذا</th></tr>
        ${tableRows || '<tr><td colspan="3">هنوز پاسخی ثبت نشده</td></tr>'}
      </table>
    </div>
  `;
  return true;
}

/* ---------------- Init ---------------- */
(async function init(){
  await restoreState();
  const isAdmin = await maybeRenderAdmin();
  if(!isAdmin){
    if(state.date && state.time && state.food) state.step='final';
    else if(state.date && state.time) state.step='food';
    render();
  }
})();
</script>
